services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-uni-courseware}/api-server:${IMAGE_TAG:-latest}
    env_file: .env.prod
    restart: unless-stopped
    networks:
      - uni-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-uni-courseware}/web:${IMAGE_TAG:-latest}
    env_file: .env.prod
    restart: unless-stopped
    networks:
      - uni-network
    depends_on:
      api:
        condition: service_started

  db:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: uni_courseware
    networks:
      - uni-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - uni-network
    depends_on:
      - web
    restart: unless-stopped

networks:
  uni-network:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
