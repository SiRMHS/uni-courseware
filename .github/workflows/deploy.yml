name: Build and Push Web and API

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # تبدیل نام ریپازیتوری به حروف کاملاً کوچک برای استاندارد داکر
      - name: Downcase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ========================================================
      # 1. بیلد و آپلود پکیج فرانت‌آند (Web)
      # ========================================================
      - name: Build and push Web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/web:2.3

      # ========================================================
      # 2. 👈 بیلد و آپلود پکیج جدید بک‌آند (API Server)
      # ========================================================
      - name: Build and push API Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api # مطمئن شو نام داکرفایل بک‌آندت دقیقاً همین باشد
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/api-server:2.3